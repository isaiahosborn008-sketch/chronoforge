<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20242a"/>
      <stop offset="55%" stop-color="#14171a"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a862"/>
      <stop offset="60%" stop-color="#c17b3e"/>
      <stop offset="100%" stop-color="#7a4820"/>
    </linearGradient>
    <radialGradient id="ledglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9f8ff"/>
      <stop offset="45%" stop-color="#37d6ff"/>
      <stop offset="100%" stop-color="#0e6c8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- outer bronze gear ring -->
  <g transform="translate(256,256)" fill="url(#bronze)">
    <path d="M0 -196 L18 -196 L26 -168 L54 -158 L76 -178 L96 -158 L82 -132 L96 -108 L124 -104 L128 -78 L102 -66 L98 -38 L120 -18 L106 8 L78 0 L58 20 L64 48 L44 66 L20 48 L-8 58 L-14 86 L-40 90 L-48 62 L-76 56 L-92 80 L-116 66 L-104 40 L-122 18 L-150 20 L-158 -6 L-134 -22 L-134 -50 L-160 -64 L-150 -90 L-122 -84 L-104 -106 L-114 -132 L-92 -152 L-70 -134 L-42 -144 L-34 -172 L-8 -178 Z"
      transform="scale(0.98)"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="url(#bg)" stroke="#3a4046" stroke-width="4"/>

  <!-- LED glow behind clock -->
  <circle cx="256" cy="256" r="120" fill="url(#ledglow)" opacity="0.35" filter="url(#blur)"/>

  <!-- clock face -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#4d545b" stroke-width="6"/>
  <circle cx="256" cy="256" r="4" fill="#8fefff"/>
  <!-- hour hand -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#c17b3e" stroke-width="10" stroke-linecap="round"/>
  <!-- minute / LED hand -->
  <line x1="256" y1="256" x2="330" y2="256" stroke="#37d6ff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="330" cy="256" r="7" fill="#8fefff"/>

  <!-- tick marks -->
  <g stroke="#6b7278" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="146" x2="256" y2="160"/>
    <line x1="256" y1="352" x2="256" y2="366"/>
    <line x1="146" y1="256" x2="160" y2="256"/>
    <line x1="352" y1="256" x2="366" y2="256"/>
  </g>
</svg>
